name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: ["main"]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "microsoft"
          java-version: "17"
          cache: "maven"
      - name: Build
        run: mvn package -DskipTests -B
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::805393737102:role/githubaction-cicd-uploadjar
      - name: Upload jar to S3
        run: |
          cp ./target/url-shortener*.jar ./target/app.jar
          aws s3 cp ./target/app.jar s3://url-shortner-s3-805393737102-ap-southeast-1-an/app.jar
      - name: Replace EC2 instances (they pull the new jar at boot)
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name url-shortener-asg \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200}'
